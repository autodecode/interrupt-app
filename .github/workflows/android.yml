name: Build INTERRUPT Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create package.json
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi

      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Prepare web assets
        run: |
          rm -rf www android
          mkdir -p www
          cp index.html www/
          cp app.js www/
          cp style.css www/
          cp -r core www/
          cp -r locales www/
          if [ -f manifest.json ]; then cp manifest.json www/; fi
          if [ -f sw.js ]; then cp sw.js www/; fi
          if [ -d icons ]; then cp -r icons www/; fi

      - name: Initialize Capacitor
        run: |
          npx cap init INTERRUPT com.interrupt.app --web-dir www

      - name: Add Android platform
        run: |
          npx cap add android

      - name: Sync web application
        run: |
          npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: interrupt-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
