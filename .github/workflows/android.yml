name: Build INTERRUPT Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure Android SDK
        run: |
          set -e

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          test -d "$ANDROID_SDK_ROOT"

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/bin/sdkmanager"
          fi

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            find "$ANDROID_SDK_ROOT" -maxdepth 5 -type f -name sdkmanager -print || true
            exit 1
          fi

          SDK_DIR="$(dirname "$(dirname "$SDKMANAGER")")"

          echo "$SDK_DIR/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          echo "SDKMANAGER=$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses > /dev/null || true

          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-35"
          "$SDKMANAGER" "build-tools;35.0.0"
          "$SDKMANAGER" "ndk;27.2.12479018"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Verify Android toolchain
        run: |
          set -e

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

          test -x "$ANDROID_NDK_HOME/ndk-build"

          "$ANDROID_NDK_HOME/ndk-build" --version

      - name: Build HEV tunnel
        run: |
          set -e

          mkdir -p native-build
          cd native-build

          git clone --recursive \
            --branch 2.17.1 \
            https://github.com/heiher/hev-socks5-tunnel.git \
            hev-socks5-tunnel

          "$ANDROID_NDK_HOME/ndk-build" \
            NDK_PROJECT_PATH="$PWD/hev-socks5-tunnel" \
            APP_BUILD_SCRIPT="$PWD/hev-socks5-tunnel/Android.mk" \
            APP_ABI="armeabi-v7a arm64-v8a x86 x86_64" \
            APP_PLATFORM=android-29 \
            NDK_LIBS_OUT="$PWD/tunnel-libs" \
            NDK_OUT="$PWD/tunnel-obj"

      - name: Build HEV SOCKS5 server
        run: |
          set -e

          cd native-build

          git clone --recursive \
            --branch 2.7.0 \
            https://github.com/heiher/hev-socks5-server.git \
            hev-socks5-server

          "$ANDROID_NDK_HOME/ndk-build" \
            NDK_PROJECT_PATH="$PWD/hev-socks5-server" \
            APP_BUILD_SCRIPT="$PWD/hev-socks5-server/Android.mk" \
            APP_ABI="armeabi-v7a arm64-v8a x86 x86_64" \
            APP_PLATFORM=android-29 \
            APP_CFLAGS="-DPKGNAME=hev/socks5 -DCLSNAME=Socks5Service" \
            NDK_LIBS_OUT="$PWD/server-libs" \
            NDK_OUT="$PWD/server-obj"

      - name: Verify HEV libraries
        run: |
          set -e

          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            test -f \
              "native-build/tunnel-libs/$abi/libhev-socks5-tunnel.so"

            test -f \
              "native-build/server-libs/$abi/libhev-socks5-server.so"
          done

      - name: Install HEV libraries
        run: |
          set -e

          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            mkdir -p \
              "android-native/src/main/jniLibs/$abi"

            cp \
              "native-build/tunnel-libs/$abi/libhev-socks5-tunnel.so" \
              "android-native/src/main/jniLibs/$abi/"

            cp \
              "native-build/server-libs/$abi/libhev-socks5-server.so" \
              "android-native/src/main/jniLibs/$abi/"
          done

      - name: Install Capacitor
        run: |
          npm init -y

          npm install \
            @capacitor/core \
            @capacitor/cli \
            @capacitor/android

      - name: Prepare web application
        run: |
          set -e

          rm -rf www
          mkdir -p www

          cp index.html www/
          cp app.js www/
          cp style.css www/

          if [ -d core ]; then
            cp -r core www/
          fi

          if [ -d locales ]; then
            cp -r locales www/
          fi

          if [ -f manifest.json ]; then
            cp manifest.json www/
          fi

          if [ -d icons ]; then
            cp -r icons www/
          fi

      - name: Initialize Capacitor
        run: |
          npx cap init \
            INTERRUPT \
            com.interrupt.app \
            --web-dir www

          npx cap add android

      - name: Install native INTERRUPT source
        run: |
          set -e

          mkdir -p android/app/src/main/java
          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/jniLibs

          cp -r \
            android-native/src/main/java/* \
            android/app/src/main/java/

          cp -r \
            android-native/src/main/assets/* \
            android/app/src/main/assets/

          cp -r \
            android-native/src/main/jniLibs/* \
            android/app/src/main/jniLibs/

          cp \
            android-native/src/main/AndroidManifest.xml \
            android/app/src/main/AndroidManifest.xml

          test -f \
            android-native/src/main/java/com/interrupt/app/MainActivity.java

          mkdir -p \
            android/app/src/main/java/com/interrupt/app

          cp \
            android-native/src/main/java/com/interrupt/app/MainActivity.java \
            android/app/src/main/java/com/interrupt/app/MainActivity.java

      - name: Install Android application icon
        run: |
          set -e

          test -f icons/icon-512.png

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p \
              "android/app/src/main/res/mipmap-$density"

            cp \
              icons/icon-512.png \
              "android/app/src/main/res/mipmap-$density/ic_launcher.png"
          done

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          old = '<application\n        android:allowBackup="false"'

          new = '<application\n        android:allowBackup="false"\n        android:icon="@mipmap/ic_launcher"\n        android:roundIcon="@mipmap/ic_launcher"'

          if old not in text:
              raise SystemExit(
                  "Expected application declaration not found"
              )

          text = text.replace(old, new, 1)

          manifest.write_text(text)
          PY

      - name: Verify native source
        run: |
          set -e

          test -f \
            android/app/src/main/java/com/interrupt/app/MainActivity.java

          test -f \
            android/app/src/main/java/com/interrupt/app/protection/InterruptVpnService.java

          test -f \
            android/app/src/main/java/com/interrupt/app/protection/HevTunnelController.java

          test -f \
            android/app/src/main/java/hev/htproxy/TProxyService.java

          test -f \
            android/app/src/main/java/hev/socks5/Socks5Service.java

          test -f \
            android/app/src/main/assets/hev/tunnel.yml

          test -f \
            android/app/src/main/assets/hev/socks5.yml

          test -f \
            android/app/src/main/res/mipmap-mdpi/ic_launcher.png

          test -f \
            android/app/src/main/res/mipmap-hdpi/ic_launcher.png

          test -f \
            android/app/src/main/res/mipmap-xhdpi/ic_launcher.png

          test -f \
            android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png

          test -f \
            android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          grep -q \
            'android:icon="@mipmap/ic_launcher"' \
            android/app/src/main/AndroidManifest.xml

          grep -q \
            'android:roundIcon="@mipmap/ic_launcher"' \
            android/app/src/main/AndroidManifest.xml

          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            test -f \
              "android/app/src/main/jniLibs/$abi/libhev-socks5-tunnel.so"

            test -f \
              "android/app/src/main/jniLibs/$abi/libhev-socks5-server.so"
          done

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: interrupt-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
