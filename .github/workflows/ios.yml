name: Build INTERRUPT iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create package.json
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi

      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/ios

      - name: Prepare web assets
        run: |
          rm -rf www ios
          mkdir -p www

          cp index.html www/
          cp app.js www/
          cp style.css www/

          if [ -d core ]; then cp -r core www/; fi
          if [ -d locales ]; then cp -r locales www/; fi
          if [ -f manifest.json ]; then cp manifest.json www/; fi
          if [ -f sw.js ]; then cp sw.js www/; fi
          if [ -d icons ]; then cp -r icons www/; fi

      - name: Initialize Capacitor
        run: |
          npx cap init INTERRUPT com.interrupt.app --web-dir www

      - name: Add iOS platform
        run: |
          npx cap add ios

      - name: Sync iOS project
        run: |
          npx cap sync ios

      - name: Show iOS project structure
        run: |
          find ios/App -maxdepth 2 -type f | sort

      - name: Build iOS Simulator app
        working-directory: ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: interrupt-ios-build
          path: ios/App/build/Build/Products/Debug-iphonesimulator/App.app
